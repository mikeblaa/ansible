---
- name: configure Fedora workstation
  hosts: localhost
  connection: local
  become: yes
  roles:
    - role: common
    - role: fedora-workstation
      vars:
        workstation_hostname: prime.maballou.com
        workstation_ipv4_address: 192.168.0.99
        workstation_ipv4_prefix: 16
        workstation_ipv4_gateway: 192.168.1.1
        workstation_dns: 192.168.2.1 192.168.3.1
        workstation_domain: maballou.com
...
